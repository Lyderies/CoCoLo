name: ci

# A pull request is checked once, as a pull request; other branches are checked when a
# pull request opens for them, and main and tags on every push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to the same pull request or branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The test suites run locally on macOS and Linux before a release; CI runs only these checks
  # until 0.4.0 splits the tests into quick stages.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Identifier guard (files and commit identities)
        run: python scripts/check_identifiers.py --commits HEAD
      - name: Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.3
          ruff check .
