name: ci

# A pull request is checked once, as a pull request; other branches are checked when a
# pull request opens for them, and main and tags on every push. Every night the whole
# suite runs on both systems.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

# A newer push to the same pull request or branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Test stages (scripts/test-stages.json): unit tests start no process, socket or sleep and
# take seconds; integration tests run real services, children and sandboxes; e2e tests run
# the setup wizard and the installer as programs. A pull request runs unit tests on both
# systems and integration tests on Ubuntu; main, tags and the nightly run add the rest.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Identifier guard (files and commit identities)
        run: python scripts/check_identifiers.py --commits HEAD
      - name: Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.3
          ruff check .

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python scripts/parallel_tests.py --stage unit --jobs "$(getconf _NPROCESSORS_ONLN)"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Integration tests, one of three shards
        # One runner at two jobs per core took 8-9 minutes, and its tests that start real CLI
        # processes ran into their time bounds under that load (PLAN T4). Three shards balanced by
        # recorded time, one job per core: less work and less load on each.
        run: python scripts/parallel_tests.py --stage integration --shard "${{ matrix.shard }}/3" --jobs "$(getconf _NPROCESSORS_ONLN)" | tee "$RUNNER_TEMP/integration.txt"
      - name: Keep the failed modules' work
        # A failure seen only on these runners can be read from the kept folders (PLAN T4c). Only
        # synthetic fixtures and test keys are in them.
        if: failure()
        run: |
          python - "$RUNNER_TEMP/integration.txt" > "$RUNNER_TEMP/failed.txt" <<'EOF'
          import json, sys
          text = open(sys.argv[1]).read()
          report = json.loads(text[text.rindex("\n{") + 1:])
          print("\n".join(sorted({unit.split("#")[0] for unit in report["failed_units"]})))
          EOF
          mkdir -p "$RUNNER_TEMP/kept"
          while read -r module; do
            [ -n "$module" ] || continue
            python scripts/parallel_tests.py --keep --module "$module" --jobs "$(getconf _NPROCESSORS_ONLN)" > "$RUNNER_TEMP/kept/rerun-${module//[^A-Za-z0-9_.]/_}.txt" 2>&1 || true
            logs=$(python -c 'import json,sys; t=open(sys.argv[1]).read(); print(json.loads(t[t.rindex("\n{")+1:])["logs"])' "$RUNNER_TEMP/kept/rerun-${module//[^A-Za-z0-9_.]/_}.txt" 2>/dev/null || true)
            [ -n "$logs" ] && tar --warning=no-file-ignored -czf "$RUNNER_TEMP/kept/${module//[^A-Za-z0-9_.]/_}.tgz" -C "$logs" . 2>/dev/null || true
          done < "$RUNNER_TEMP/failed.txt"
      - name: Upload the kept work
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-shard-${{ matrix.shard }}-kept
          path: ${{ runner.temp }}/kept
          retention-days: 7

  full:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A stuck run should not hold a (costly) runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: End-to-end tests (and integration tests on macOS)
        env:
          MORE: ${{ matrix.os == 'macos-latest' && '--stage integration' || '' }}
        run: python scripts/parallel_tests.py --stage e2e $MORE --jobs "$((2 * $(getconf _NPROCESSORS_ONLN)))"
