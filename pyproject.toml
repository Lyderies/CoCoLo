[project]
name = "codex-claude-agent-orchestration"
version = "0.0.0"
description = "Deterministic cross-provider orchestration of Codex and Claude child agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Installed as Codex package 0.8.29, whose runtime must not change in place: an f-string without
# placeholders (line 88). Fixed with the next runtime version.
"packages/codex-agents/native-package/.codex/orchestration/codex_agents/collector_exit.py" = ["F541"]
